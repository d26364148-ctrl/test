name: Build Clang ARM64

on:
  workflow_dispatch:

jobs:
  build-clang:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 git lld clang

      - name: Clone LLVM project
        run: |
          git clone --depth 1 https://github.com/llvm/llvm-project.git llvm-src

      - name: Configure CMake
        run: |
          cmake -G Ninja -S llvm-src/llvm -B build \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_PARALLEL_LINK_JOBS=1

      - name: Build clang and lld
        run: |
          ninja -C build clang lld
          ./build/bin/clang --version

      - name: Upload clang binary
        uses: actions/upload-artifact@v4
        with:
          name: clang-arm64-toolchain
          path: build/bin/clang
