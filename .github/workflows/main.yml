name: GitHub VM com Túnel Bore SSH e QEMU

on:
  workflow_dispatch:

jobs:
  ssh-tunnel:
    runs-on: ubuntu-22.04

    steps:
      - name: Configurar e Iniciar Servidor SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          echo "runner:123456" | sudo chpasswd
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart

      - name: Instalar QEMU e Liberar Permissões KVM
        run: |
          # Instala o QEMU e utilitários necessários
          sudo apt-get install -y qemu-system-x86 qemu-utils wget unzip
          
          # Libera permissões do KVM para o usuário atual (runner)
          sudo usermod -aG kvm $USER
          
          # Altera as permissões diretas do dispositivo KVM para garantir acesso imediato
          sudo chmod 666 /dev/kvm

      - name: Baixar ISO do Android x86 2.2
        run: |
          # Cria uma pasta para o sistema e entra nela
          mkdir -p android_vm
          cd android_vm
          
          # Baixa o pacote compactado contendo as imagens ISO de desenvolvimento do sjarb com o link fornecido
          wget -O android_froyo.zip "https://archive.org/compress/sjarb_android_2.2/formats=ISO%20IMAGE&file=/sjarb_android_2.2.zip"
          
          # Extrai o conteúdo do arquivo ZIP
          unzip android_froyo.zip
          
          # Renomeia o arquivo que contém "generic" no nome para "android-x86-2.2.iso"
          # Caso não ache o "generic", ele pega qualquer arquivo .iso extraído
          mv *generic*.iso android-x86-2.2.iso || mv *.iso android-x86-2.2.iso
          
          # Cria um disco virtual de 4GB para instalar o Android
          qemu-img create -f qcow2 android_disk.qcow2 4G

      - name: Iniciar QEMU KVM com VNC
        run: |
          cd android_vm
          # Inicia o QEMU usando KVM, alocando 1GB de RAM e ativando o VNC na porta padrão (:0 -> 5900)
          # O parâmetro -vga std ajuda na compatibilidade de tela do Android antigo
          sudo qemu-system-x86_64 -enable-kvm -m 1024 -smp 2 \
            -hda android_disk.qcow2 \
            -cdrom android-x86-2.2.iso \
            -boot d \
            -vga std \
            -vnc :0 &
          
          echo "Aguardando 5 segundos para o QEMU iniciar..."
          sleep 5

      - name: Instalar o Bore
        run: |
          wget -q https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/
          chmod +x /usr/local/bin/bore

      - name: Iniciar Túneis Bore (SSH e VNC)
        run: |
          echo "=== A INICIAR TÚNEIS BORE ==="
          
          # Redireciona a porta 22 (SSH)
          bore local 22 --to bore.pub &
          
          # Redireciona a porta 5900 (VNC do QEMU)
          bore local 5900 --to bore.pub &
          
          # Aguarda para exibir as portas nos logs do GitHub Actions
          sleep 5
          
          echo "=================================================="
          echo "Verifique as portas geradas pelo Bore nos logs acima!"
          echo "Para SSH: ssh runner@bore.pub -p <porta_ssh>"
          echo "Para VNC: Use um cliente VNC apontando para bore.pub:<porta_vnc>"
          echo "Password SSH: 123456"
          echo "=================================================="
          
          # Mantém a VM ativa por 2 horas
          sleep 7200
          
