name: GitHub VM com Túnel Bore SSH

on:
  workflow_dispatch:

jobs:
  ssh-tunnel:
    runs-on: ubuntu-22.04

    steps:
      - name: Configurar e Iniciar Servidor SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          
          # Definir uma password temporária para o utilizador 'runner'
          echo "runner:123456" | sudo chpasswd
          
          # Permitir autenticação por password no SSH
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          
          # Iniciar o serviço SSH
          sudo service ssh restart

      - name: Instalar o Bore
        run: |
          wget -q https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/
          chmod +x /usr/local/bin/bore

      - name: Iniciar Túnel Bore para a Porta SSH (22)
        run: |
          echo "=== A INICIAR TÚNEL BORE ==="
          # Redireciona a porta 22 (SSH) local através do bore.pub
          bore local 22 --to bore.pub &
          
          # Aguarda para o túnel estabelecer e mostrar a porta atribuída nos logs
          sleep 5
          
          echo "Para se ligar, utilize no seu terminal:"
          echo "ssh runner@bore.pub -p <porta_gerada>"
          echo "Password: 123456"
          
          # Mantém a VM do GitHub ativa durante 2 horas
          sleep 7200
