name: Damn Small Linux via QEMU KVM + Bore VNC

on:
  workflow_dispatch:

jobs:
  qemu-vnc-vm:
    runs-on: ubuntu-22.04

    steps:
      - name: Instalar QEMU e Bore
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils wget
          
          # Descarregar e instalar o bore v0.6.0[span_1](start_span)[span_1](end_span)
          wget -q https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/
          chmod +x /usr/local/bin/bore

      - name: Descarregar a ISO do Damn Small Linux
        run: |
          wget -q "https://archive.org/download/damn-small-linux-4.4.10/dsl-4.4.10.iso" -O dsl.iso

      - name: Iniciar QEMU com KVM e VNC (Porta 5900)
        run: |
          # Liberta as permissões do KVM
          sudo chmod 666 /dev/kvm
          
          qemu-system-x86_64 \
            -enable-kvm \
            -cpu host \
            -m 512 \
            -smp 2 \
            -cdrom dsl.iso \
            -boot d \
            -vnc 127.0.0.1:0 \
            -netdev user,id=net0 \
            -device rtl8139,netdev=net0 &
          
          echo "QEMU a arrancar com KVM..."

      - name: Expor VNC via Bore TCP Tunnel
        run: |
          echo "=== A INICIAR TÚNEL BORE ==="
          # Inicia o bore apontando para o servidor público padrão (bore.pub)
          bore local 5900 --to bore.pub &
          
          # Aguarda o estabelecimento do túnel e mostra o endereço/porta gerados
          sleep 5
          
          # Mantém a VM ativa por 2 horas
          sleep 7200
          
