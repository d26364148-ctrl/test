name: Build ExtendedAndroidTools CI

on:
  workflow_dispatch: # Permite clicar em "Run workflow" manualmente no site do GitHub
  push:
    branches: [ "main", "master" ]

jobs:
  build-tools:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar o repositório oficial
        run: |
          git clone https://github.com/facebookexperimental/ExtendedAndroidTools.git

      - name: 2. Construir a imagem Docker
        run: |
          cd ExtendedAndroidTools
          ./scripts/build-docker-image.sh

      - name: 3. Compilar as ferramentas (bpftrace / bpftools)
        run: |
          cd ExtendedAndroidTools
          # Nota: Em vez de run-docker-build-env.sh (que abre um terminal interativo e daria erro no CI),
          # usamos o comando direto do Docker para correr o make de forma automática.
          docker run --rm -v "$(pwd)":/workspace -w /workspace extended-android-tools make bpftools

      - name: 4. Partilhar o link de download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: bpftools-arm64-package
          path: |
            ExtendedAndroidTools/out/android/**/*.tar.gz
            ExtendedAndroidTools/*.tar.gz
            
