name: Build aapt2 for ARM64

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar o repositório com submodules (essencial para o aapt2 da ReVanced)
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          repository: 'ReVanced/aapt2'
          submodules: 'recursive'
          fetch-depth: 1

      # 2. Instalar dependências necessárias (como o protoc)
      - name: Install Protobuf Compiler
        run: |
          wget https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          sudo unzip -p protoc-*.zip bin/protoc -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/protoc

      # 3. Configurar o Android NDK (necessário para compilar código nativo C++)
      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '27.3.13750724'
          components: 'ndk;27.3.13750724'

      # 4. Aplicar patches e compilar o aapt2 para arm64-v8a
      - name: Build aapt2 arm64-v8a
        run: |
          ./patch.sh
          ANDROID_NDK="$ANDROID_HOME/ndk/27.3.13750724" ./build.sh arm64-v8a

      # 5. Guardar o binário compilado como artefato para poderes descarregar e usar no telemóvel
      - name: Upload aapt2 arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: aapt2-arm64-v8a
          path: build/bin/aapt-*
          
