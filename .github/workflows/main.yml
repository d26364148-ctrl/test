name: Build ExtendedAndroidTools CI

on:
  workflow_dispatch: # Permite disparar manualmente no site do GitHub
  push:
    branches: [ "main", "master" ]

jobs:
  build-tools:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar o repositório oficial
        run: |
          git clone https://github.com/facebookexperimental/ExtendedAndroidTools.git

      - name: 2. Construir a imagem Docker
        run: |
          cd ExtendedAndroidTools
          ./scripts/build-docker-image.sh

      - name: 3. Compilar as ferramentas DENTRO do Docker
        run: |
          cd ExtendedAndroidTools
          # O comando docker run garante que o 'make bpftools' corre dentro do ambiente isolado,
          # evitando o erro 126 no host do Ubuntu.
          docker run --rm -v "$(pwd)":/workspace -w /workspace extended-android-tools make bpftools

      - name: 4. Guardar Binários (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: bpftools-arm64-package
          path: |
            ExtendedAndroidTools/out/android/**/*.tar.gz
            ExtendedAndroidTools/*.tar.gz
            
