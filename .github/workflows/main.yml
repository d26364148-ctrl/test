name: Android x86 2.2 QEMU KVM

on:
  workflow_dispatch:

jobs:
  run-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # Define o limite máximo do job para 3 horas

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify KVM Acceleration
        run: |
          echo "Verificando suporte a KVM no runner do GitHub..."
          sudo apt-get update
          sudo apt-get install -y cpu-checker unzip
          kvm-ok
          sudo chmod 777 /dev/kvm
          ls -l /dev/kvm

      - name: Install QEMU, noVNC and Tools (via APT)
        run: |
          sudo apt-get install -y qemu-kvm qemu-system-x86 curl wget novnc python3-websockify

      - name: Download and Extract Android x86 2.2 from Archive.org
        run: |
          echo "A descarregar o pacote ZIP do Archive.org..."
          wget -O sjarb_android_2.2.zip "https://archive.org/compress/sjarb_android_2.2/formats=ISO%20IMAGE&file=/sjarb_android_2.2.zip"
          
          echo "A extrair o conteúdo..."
          unzip sjarb_android_2.2.zip -d extracted_android/
          
          # Localizar e copiar a ISO genérica para a raiz do workspace
          find extracted_android/ -name "*generic*.iso" -exec cp {} android-x86.iso \;
          ls -l android-x86.iso

      - name: Create Virtual Hard Disk
        run: |
          qemu-img create -f qcow2 android_disk.qcow2 2G

      - name: Launch QEMU with KVM and Web Browser VNC
        run: |
          echo "A iniciar o QEMU com aceleração KVM e VNC..."
          qemu-system-x86_64 \
            -enable-kvm \
            -cpu host \
            -m 1024 \
            -smp 2 \
            -cdrom android-x86.iso \
            -hda android_disk.qcow2 \
            -net nic,model=e1000 \
            -net user \
            -vnc :0 &

          echo "A iniciar o Websockify para o noVNC na porta 6080..."
          websockify --web /usr/share/novnc/ 6080 localhost:5900 &

          echo "A criar túnel web seguro via SSH (localhost.run)..."
          ssh -o StrictHostKeyChecking=no -R 80:localhost:6080 localhost.run &

      - name: Setup Tmate (Terminal Backup)
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false

      - name: Keep Alive
        run: |
          echo "Ambiente a correr por 3 horas. Procura nos logs o link do localhost.run para abrir o ecrã no navegador!"
          sleep 3h
          
