name: GitHub VM com Túnel Rápido SSH e QEMU

on:
  workflow_dispatch:

jobs:
  ssh-tunnel:
    runs-on: ubuntu-22.04

    steps:
      - name: Configurar e Iniciar Servidor SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          echo "runner:123456" | sudo chpasswd
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart

      - name: Instalar QEMU e Liberar Permissões KVM
        run: |
          sudo apt-get install -y qemu-system-x86 qemu-utils wget unzip
          sudo usermod -aG kvm $USER
          sudo chmod 666 /dev/kvm

      - name: Baixar ISO do Android x86 2.2
        run: |
          mkdir -p android_vm
          cd android_vm
          wget -O android_froyo.zip "https://archive.org/compress/sjarb_android_2.2/formats=ISO%20IMAGE&file=/sjarb_android_2.2.zip"
          unzip android_froyo.zip
          mv *generic*.iso android-x86-2.2.iso || mv *.iso android-x86-2.2.iso
          qemu-img create -f qcow2 android_disk.qcow2 4G

      - name: Iniciar QEMU KVM com VNC
        run: |
          cd android_vm
          sudo qemu-system-x86_64 -enable-kvm -m 1024 -smp 2 \
            -hda android_disk.qcow2 \
            -cdrom android-x86-2.2.iso \
            -boot d \
            -vga std \
            -vnc :0 &
          
          echo "Aguardando 5 segundos para o QEMU iniciar..."
          sleep 5

      - name: Iniciar Túneis Rápidos (SSH e VNC via Pinggy)
        run: |
          echo "=== INICIANDO TÚNEIS SEM LOGIN ==="
          
          # Garante que o SSH local confie no servidor do Pinggy
          mkdir -p ~/.ssh
          ssh-keyscan -p 443 free.pinggy.io >> ~/.ssh/known_hosts
          
          # Cria o túnel para o SSH do Runner (Porta 22)
          # O comando 'StrictHostKeyChecking=no' evita paradas pedindo confirmação
          ssh -o StrictHostKeyChecking=no -p 443 -R0:localhost:22 qr@free.pinggy.io > ssh_tunnel.log 2>&1 &
          
          # Cria o túnel para o VNC da VM (Porta 5900)
          ssh -o StrictHostKeyChecking=no -p 443 -R0:localhost:5900 qr@free.pinggy.io > vnc_tunnel.log 2>&1 &
          
          # Aguarda 5 segundos para os túneis estabelecerem a conexão
          sleep 5
          
          echo "=================================================="
          echo "=== DADOS DE CONEXÃO DO SEU TUNEL RÁPIDO ==="
          echo "=================================================="
          echo "Procure pelas linhas 'tcp://a.pinggy.link:xxxxx' nos logs abaixo:"
          echo ""
          echo "--- ENDEREÇO PARA SSH ---"
          cat ssh_tunnel.log | grep -E "tcp://" || cat ssh_tunnel.log
          echo ""
          echo "--- ENDEREÇO PARA VNC ---"
          cat vnc_tunnel.log | grep -E "tcp://" || cat vnc_tunnel.log
          echo "=================================================="
          echo "Password do SSH do Runner: 123456"
          echo "=================================================="
          
          # Mantém a VM ativa por 2 horas
          sleep 7200
          
