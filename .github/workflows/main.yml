name: Damn Small Linux via QEMU KVM + VNC TCP

on:
  workflow_dispatch:

jobs:
  qemu-vnc-vm:
    runs-on: ubuntu-22.04

    steps:
      - name: Instalar QEMU e Cloudflared
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils wget
          
          # Descarregar o binário oficial do Cloudflare Tunnel
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Descarregar a ISO do Damn Small Linux
        run: |
          wget -q "https://archive.org/download/damn-small-linux-4.4.10/dsl-4.4.10.iso" -O dsl.iso

      - name: Iniciar QEMU com KVM e VNC (Porta 5900)
        run: |
          # Liberta as permissões do KVM
          sudo chmod 666 /dev/kvm
          
          # 0.0.0.0:0 abre o VNC na porta padrão 5900 aceita pelo túnel TCP
          qemu-system-x86_64 \
            -enable-kvm \
            -cpu host \
            -m 512 \
            -smp 2 \
            -cdrom dsl.iso \
            -boot d \
            -vnc 0.0.0.0:0 \
            -netdev user,id=net0 \
            -device rtl8139,netdev=net0 &
          
          echo "QEMU a arrancar com KVM..."

      - name: Expor VNC via Cloudflare TCP Tunnel
        run: |
          echo "=== A INICIAR TÚNEL TCP CLOUDFLARE ==="
          cloudflared tunnel --url tcp://localhost:5900 > vnc_tcp.log 2>&1 &
          
          sleep 10
          
          echo "=== ENDEREÇO TCP PARA A APP VNC ==="
          cat vnc_tcp.log | grep -oE "tcp://[a-zA-Z0-9.-]+\.trycloudflare\.com:[0-9]+" || cat vnc_tcp.log
          echo "=================================="
          
          # Mantém a VM ativa por 2 horas
          sleep 7200
          
