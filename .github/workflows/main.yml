name: Build Samsung i9082 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import image and run build commands
        run: |
          sudo mkdir -p /workspaces
          sudo chown -R $USER:$USER /workspaces
          wget -q -O /workspaces/13.10_saucy_x86.tar.zst https://github.com/2cd/ubuntu-museum/releases/download/13.10/13.10_saucy_x86.tar.zst
          zstd -dc /workspaces/13.10_saucy_x86.tar.zst | docker import - ubuntu:13.10-x86
          OLD_REL_IP=$(getent ahosts old-releases.ubuntu.com | awk '{ print $1; exit }')
          docker run --rm --network host --add-host "old-releases.ubuntu.com:${OLD_REL_IP:-91.189.91.123}" -v /workspaces:/workspaces -v "${{ github.workspace }}:/repo" -w /workspaces ubuntu:13.10-x86 /bin/bash -c '
            set -e
            apt-get update
            apt-get install -y --force-yes build-essential libncurses5-dev bc lzop git
            apt-get install -y --force-yes gcc-arm-linux-gnueabihf
            GIT_SSL_NO_VERIFY=1 git clone --depth=1 https://github.com/codekidX/android_kernel_frost_i9082.git
            cd android_kernel_frost_i9082
            sed -i "1i #ifndef F_OFD_GETLK\n#define F_OFD_GETLK 36\n#endif" arch/arm/kernel/sys_oabi-compat.c
            make ARCH=arm mrproper
            make ARCH=arm cyanogenmod_i9082_defconfig
            make -j$(nproc) ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-
            mkdir -p /repo/out
            cp arch/arm/boot/zImage /repo/out/
            find . -name "*.ko" -exec cp {} /repo/out/ \;
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: i9082-kernel
          path: out/*
