name: Build Appzuku APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. FAZ O CLONE DO REPOSITÓRIO (Essencial para baixar o código-fonte)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: 'northmendo/Appzuku'
          token: ${{ secrets.GITHUB_TOKEN }} # Opcional se for público, obrigatório se for privado

      # 2. Configurar o ambiente Java (OpenJDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar o Android SDK Manager (SDK, Build-Tools e NDK)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: '34'
          build-tools-version: '34.0.0'
          ndk-version: '29.0.13117171'
          components: platforms;android-34 build-tools;34.0.0 ndk;29.0.13117171

      # 4. Dar permissão de execução ao Gradle Wrapper (gradlew)
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. Compilar a APK em modo Debug
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      # 6. Guardar a APK gerada como artefato do GitHub Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appzuku-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
