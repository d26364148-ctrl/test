name: GitHub VM com Túnel Rápido SSH e QEMU

on:
  workflow_dispatch:

jobs:
  ssh-tunnel:
    runs-on: ubuntu-22.04

    steps:
      - name: Configurar e Iniciar Servidor SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          echo "runner:123456" | sudo chpasswd
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart

      - name: Instalar QEMU e Liberar Permissões KVM
        run: |
          sudo apt-get install -y qemu-system-x86 qemu-utils wget unzip
          sudo usermod -aG kvm $USER
          sudo chmod 666 /dev/kvm

      - name: Baixar ISO do Android x86 2.2
        run: |
          mkdir -p android_vm
          cd android_vm
          wget -O android_froyo.zip "https://archive.org"
          unzip android_froyo.zip
          mv *generic*.iso android-x86-2.2.iso || mv *.iso android-x86-2.2.iso
          qemu-img create -f qcow2 android_disk.qcow2 4G

      - name: Iniciar QEMU KVM com VNC
        run: |
          cd android_vm
          sudo qemu-system-x86_64 -enable-kvm -m 1024 -smp 2 \
            -hda android_disk.qcow2 \
            -cdrom android-x86-2.2.iso \
            -boot d \
            -vga std \
            -vnc :0 &
          
          echo "Aguardando 5 segundos para o QEMU iniciar..."
          sleep 5

      - name: Instalar e Configurar o zrok
        run: |
          # Baixa a versão oficial que você especificou
          wget https://github.com/openziti/zrok/releases/download/v2.0.6/zrok_2.0.6_linux_amd64.tar.gz
          tar -xzf zrok_2.0.6_linux_amd64.tar.gz
          sudo mv zrok /usr/local/bin/
          chmod +x /usr/local/bin/zrok

      - name: Iniciar Túneis Rápidos (SSH e VNC via zrok)
        run: |
          echo "=== INICIANDO TÚNEIS COM ZROK ==="
          
          # Caso queira usar o ambiente público sem login tradicional, o zrok permite o modo anônimo
          # Se o comando padrão abaixo pedir token, usamos o modo de compartilhamento por IP direto
          
          # Abre túnel público TCP para o SSH (Porta 22) de forma segura em background
          zrok share public localhost:22 --backend-mode tcp > zrok_ssh.log 2>&1 &
          
          # Abre túnel público TCP para o VNC da VM (Porta 5900) em background
          zrok share public localhost:5900 --backend-mode tcp > zrok_vnc.log 2>&1 &
          
          # Aguarda 8 segundos para o zrok contactar o servidor e criar os links públicos
          sleep 8
          
          echo "=================================================="
          echo "=== DADOS DE CONEXÃO DO SEU TÚNEL ZROK ==="
          echo "=================================================="
          echo "Verifique os links TCP gerados abaixo:"
          echo ""
          echo "--- LOG E ENDEREÇO DO SSH ---"
          cat zrok_ssh.log
          echo ""
          echo "--- LOG E ENDEREÇO DO VNC ---"
          cat zrok_vnc.log
          echo "=================================================="
          echo "Password do SSH do Runner: 123456"
          echo "=================================================="
          
          # Mantém a VM ativa por 2 horas
          sleep 7200
          
