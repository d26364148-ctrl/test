name: GitHub VM com QEMU e Túnel zrok2 (4 Horas)

on:
  workflow_dispatch:

jobs:
  ssh-tunnel:
    runs-on: ubuntu-22.04
    timeout-minutes: 240 # Permite que o job rode por até 4 horas

    steps:
      - name: Instalar QEMU e Liberar Permissões KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils wget unzip curl
          sudo usermod -aG kvm $USER
          sudo chmod 666 /dev/kvm

      - name: Baixar ISO do Android x86 2.2
        run: |
          mkdir -p android_vm
          cd android_vm
          wget -O android_froyo.zip "https://archive.org/compress/sjarb_android_2.2/formats=ISO%20IMAGE&file=/sjarb_android_2.2.zip"
          unzip -o android_froyo.zip
          find . -type f -name "*.iso" -exec mv {} android-x86-2.2.iso \;
          qemu-img create -f qcow2 android_disk.qcow2 4G

      - name: Instalar zrok2 Oficial
        run: |
          curl -sSf https://get.openziti.io/install.bash | sudo bash -s zrok2
          zrok2 version

      - name: Habilitar zrok2
        env:
          ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          if [ -z "$ZROK_TOKEN" ]; then
            echo "Erro: ZROK_TOKEN não configurado nos Secrets do repositório."
            exit 1
          fi
          zrok2 enable "$ZROK_TOKEN"

      - name: Iniciar QEMU KVM com VNC
        run: |
          cd android_vm
          sudo qemu-system-x86_64 -enable-kvm -m 1024 -smp 2 \
            -hda android_disk.qcow2 \
            -cdrom android-x86-2.2.iso \
            -boot d \
            -vga std \
            -vnc :0 &
          
          echo "Aguardando 5 segundos para o QEMU iniciar..."
          sleep 5

      - name: Iniciar Túnel Público com zrok2 para o VNC
        run: |
          echo "=== INICIANDO TÚNEL ZROK2 PARA O VNC ==="
          zrok2 share public localhost:5900 > zrok_tunnel.log 2>&1 &
          
          # Aguarda o túnel gerar o link de acesso
          sleep 8
          
          echo "=================================================="
          echo "=== LINK DE ACESSO ZROK2 (COPIE ABAIXO) ==="
          echo "=================================================="
          cat zrok_tunnel.log
          echo "=================================================="
          
          # Mantém a VM e o túnel ativos por 4 horas (14400 segundos)
          sleep 14400
          
