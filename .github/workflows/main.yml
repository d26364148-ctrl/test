name: Build Appzuku APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout/clone do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o ambiente Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Aceita todas as licenças do Android SDK de forma automática
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 4. Dá permissão de execução ao script do Gradle
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5. Compila a APK garantindo que o Gradle baixa o SDK/NDK necessário sozinho
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon -Dandroid.builder.sdk.download=true

      # 6. Salva a APK gerada nos artefatos da Action
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appzuku-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
