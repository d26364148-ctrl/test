name: Damn Small Linux via QEMU KVM + noVNC

on:
  workflow_dispatch:

jobs:
  qemu-vnc-vm:
    runs-on: ubuntu-22.04

    steps:
      - name: Instalar QEMU, noVNC e Cloudflared
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils wget novnc python3-websockify
          
          # Descarregar o binário oficial do Cloudflare Tunnel
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Descarregar a ISO do Damn Small Linux
        run: |
          wget -q "https://archive.org/download/damn-small-linux-4.4.10/dsl-4.4.10.iso" -O dsl.iso

      - name: Iniciar QEMU com KVM e VNC (Localhost:5900)
        run: |
          qemu-system-x86_64 \
            -enable-kvm \
            -cpu host \
            -m 512 \
            -smp 2 \
            -cdrom dsl.iso \
            -boot d \
            -vnc 127.0.0.1:0 \
            -netdev user,id=net0 \
            -device rtl8139,netdev=net0 &
          
          echo "QEMU a arrancar..."

      - name: Iniciar noVNC (Porta 6080)
        run: |
          # Cria a ponte entre o VNC (5900) e o servidor web do noVNC (6080)
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 3

      - name: Expor Web VNC via Cloudflare Tunnel
        run: |
          echo "=== A INICIAR TÚNEL CLOUDFLARE ==="
          cloudflared tunnel --url http://localhost:6080 > tunnel.log 2>&1 &
          
          sleep 8
          
          echo "=== LINK DE ACESSO WEB DIRETO ==="
          cat tunnel.log | grep -oE "https://[a-zA-Z0-9.-]+\.trycloudflare\.com"
          echo "=================================="
          
          # Mantém a VM ativa por 2 horas
          sleep 7200
          
