name: Build Appzuku APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o clone do repositório no runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Instala o SDK, Build-Tools e NDK diretamente via sdkmanager oficial
      - name: Install Android SDK and NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.13117171"

      # 4. Dá permissão de execução ao Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. Compila a APK em modo Debug
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      # 6. Guarda o APK gerado nos artefatos da Action
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appzuku-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
