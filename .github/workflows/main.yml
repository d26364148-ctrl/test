name: GitHub VM com Túnel Rápido SSH, QEMU e zrok

on:
  workflow_dispatch:

jobs:
  ssh-tunnel:
    runs-on: ubuntu-22.04

    steps:
      - name: Configurar e Iniciar Servidor SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          echo "runner:123456" | sudo chpasswd
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart

      - name: Instalar QEMU e Liberar Permissões KVM
        run: |
          sudo apt-get install -y qemu-system-x86 qemu-utils wget unzip
          sudo usermod -aG kvm $USER
          sudo chmod 666 /dev/kvm

      - name: Baixar ISO do Android x86 2.2
        run: |
          mkdir -p android_vm
          cd android_vm
          wget -O android_froyo.zip "https://archive.org/compress/sjarb_android_2.2/formats=ISO%20IMAGE&file=/sjarb_android_2.2.zip"
          unzip -o android_froyo.zip
          # Localiza qualquer arquivo .iso extraído (mesmo que esteja em subpasta) e padroniza o nome
          find . -type f -name "*.iso" -exec mv {} android-x86-2.2.iso \;
          qemu-img create -f qcow2 android_disk.qcow2 4G

      - name: Baixar e Instalar o zrok v2.0.6
        run: |
          wget https://github.com/openziti/zrok/releases/download/v2.0.6/zrok_2.0.6_linux_amd64.tar.gz
          tar -xzf zrok_2.0.6_linux_amd64.tar.gz
          sudo mv zrok /usr/local/bin/
          zrok version

      - name: Habilitar zrok
        env:
          ZROK_TOKEN: ${{ secrets.ZROK_TOKEN }}
        run: |
          if [ -z "$ZROK_TOKEN" ]; then
            echo "Aviso: ZROK_TOKEN não configurado nos Secrets do repositório. O zrok precisa de um token de ativação do zrok.io."
            exit 1
          }
          zrok enable "$ZROK_TOKEN"

      - name: Iniciar QEMU KVM com VNC
        run: |
          cd android_vm
          sudo qemu-system-x86_64 -enable-kvm -m 1024 -smp 2 \
            -hda android_disk.qcow2 \
            -cdrom android-x86-2.2.iso \
            -boot d \
            -vga std \
            -vnc :0 &
          
          echo "Aguardando 5 segundos para o QEMU iniciar..."
          sleep 5

      - name: Iniciar Compartilhamento com zrok
        run: |
          echo "=== INICIANDO TÚNEL COM ZROK ==="
          # Exemplo para expor um serviço web/proxy ou túnel público/privado conforme desejado:
          # zrok share public localhost:5900 &
          
          # Mantém a VM e o túnel ativos por 2 horas
          sleep 7200
          
