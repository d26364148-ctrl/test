name: Build Samsung i9082 Kernel (Ubuntu 13.10 x86 Docker)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Nome do defconfig"
        required: true
        default: "cyanogenmod_i9082_defconfig"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare workspaces and import Ubuntu 13.10 x86 image
        run: |
          mkdir -p /workspaces
          wget -q -O /workspaces/13.10_saucy_x86.tar.zst https://github.com/2cd/ubuntu-museum/releases/download/13.10/13.10_saucy_x86.tar.zst
          zstd -dc /workspaces/13.10_saucy_x86.tar.zst | docker import - ubuntu:13.10-x86

      - name: Compile kernel inside ubuntu:13.10-x86 container
        run: |
          docker run --rm -v /workspaces:/workspaces -v "${{ github.workspace }}:/repo" -w /workspaces ubuntu:13.10-x86 /bin/bash -c '
            set -e
            apt-get update
            apt-get install -y build-essential libncurses5-dev bc lzop git ca-certificates
            apt-get install -y gcc-arm-linux-gnueabihf

            if [ ! -d /workspaces/android_kernel_frost_i9082 ]; then
              GIT_SSL_NO_VERIFY=1 git clone --depth=1 https://github.com/codekidX/android_kernel_frost_i9082.git /workspaces/android_kernel_frost_i9082
            fi

            cd /workspaces/android_kernel_frost_i9082
            if [ -f arch/arm/kernel/sys_oabi-compat.c ] && ! grep -q "F_OFD_GETLK" arch/arm/kernel/sys_oabi-compat.c; then
              sed -i "1i #ifndef F_OFD_GETLK\n#define F_OFD_GETLK 36\n#endif" arch/arm/kernel/sys_oabi-compat.c
            fi

            make ARCH=arm mrproper
            make ARCH=arm ${{ inputs.defconfig }}
            make -j$(nproc) ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-

            mkdir -p /repo/out
            cp arch/arm/boot/zImage /repo/out/
            find . -name "*.ko" -exec cp {} /repo/out/ \;
          '

      - name: Upload compiled kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: i9082-zimage-and-modules
          path: out/*
